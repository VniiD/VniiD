<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="112" viewBox="0 0 1200 112" role="img" aria-labelledby="title description">
<title id="title">No meu laboratório</title>
<desc id="description">Banner animado da seção No meu laboratório.</desc>
<defs>
  <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0B1424"/><stop offset="1" stop-color="#11102A"/></linearGradient>
  <linearGradient id="border"><stop stop-color="#818CF8" stop-opacity=".85"/><stop offset="1" stop-color="#818CF8" stop-opacity=".55"/></linearGradient>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#94A3B8" stroke-opacity=".07"/></pattern>
</defs>
<style>
.title{fill:#F8FAFC;font:700 30px ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:.4px}
.mark{fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.banner-sweep{pointer-events:none}
@media(prefers-reduced-motion:reduce){.banner-sweep{display:none}}
</style>
<rect x="2" y="2" width="1196" height="108" rx="16" fill="url(#background)" stroke="url(#border)" stroke-width="2"/>
<rect x="3" y="3" width="1194" height="106" rx="15" fill="url(#grid)"/>
<rect class="banner-sweep" x="-180" y="3" width="160" height="106" fill="#818CF8" opacity=".05">
  <animate attributeName="x" values="-180;1200" dur="16s" repeatCount="indefinite"/>
</rect>
<svg x="28" y="24" width="64" height="64" viewBox="0 0 64 64" style="color:#818CF8">
  <circle cx="32" cy="32" r="30" fill="#818CF8" fill-opacity=".08" stroke="#818CF8" stroke-opacity=".5">
    <animate attributeName="stroke-opacity" values=".25;.8;.25" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="32" cy="32" r="25" fill="none" stroke="#818CF8" stroke-opacity=".35" stroke-width="1"/><circle cx="32" cy="7" r="2.5" fill="#818CF8"><animateTransform attributeName="transform" type="rotate" values="0 32 32;360 32 32" dur="5s" repeatCount="indefinite"/></circle><circle cx="32" cy="32" r="3" fill="#818CF8" fill-opacity=".85"><animate attributeName="r" values="2;4;2" dur="1.8s" repeatCount="indefinite"/></circle>
  <g class="mark" ><path d="M32 8a24 24 0 1 0 24 24H32z"/><path d="M39 8v17h17A24 24 0 0 0 39 8z"/><circle cx="21" cy="34" r="2" fill="currentColor"/><circle cx="29" cy="43" r="2" fill="currentColor"/><circle cx="32" cy="32" r="25" fill="none" stroke="#818CF8" stroke-opacity=".35" stroke-width="1"/><circle cx="32" cy="7" r="2.5" fill="#818CF8"><animateTransform attributeName="transform" type="rotate" values="0 32 32;360 32 32" dur="5s" repeatCount="indefinite"/></circle><circle cx="32" cy="32" r="3" fill="#818CF8" fill-opacity=".85"><animate attributeName="r" values="2;4;2" dur="1.8s" repeatCount="indefinite"/></circle></g>
</svg>
<text x="116" y="68" class="title">No meu laboratório</text>
</svg>